name: Bug report
description: Report a reproducible problem with the developer preview
body:
  - type: markdown
    attributes:
      value: 'Never include grant tokens, private prompts or customer data. Report security issues privately using SECURITY.md.'
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit, macOS, Swift and Node versions
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where did it happen?
      options:
        - Synthetic fixture mode (no model)
        - Native grant UI
        - SDK or protocol
        - Build or tests
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Error codes and build diagnostics only; remove credentials, personal paths and prompt/output content.
